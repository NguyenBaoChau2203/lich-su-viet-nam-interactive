name: Verify Plan A branch

on:
  push:
    branches:
      - foundation/agent-os-plan-a

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: pnpm install --lockfile-only
      - name: Commit refreshed lockfile
        run: |
          if [ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm lockfile"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/agents/bootstrap.mjs --harness codex
      - run: node scripts/agents/bootstrap.mjs --harness antigravity
      - run: node scripts/agents/bootstrap.mjs --harness opencode
