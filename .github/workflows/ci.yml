name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Public synthetic values satisfy the existing SSR client constructor.
    # No valid key, live project or database is used by the selected smoke cases.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_smoke_fixture_not_a_real_key
      NEXT_PUBLIC_SITE_URL: http://localhost:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application and agent setup
        run: pnpm verify

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public browser smoke test without database credentials
        run: pnpm test:e2e:smoke

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
